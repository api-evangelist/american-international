summary: >-
  AIG publishes no public API reference and no OpenAPI, so this profile is built entirely from the
  identity metadata AIG's own Okta tenant serves anonymously. AIG's commercial API gateway
  (commercial.api.aig.com) is live and rejects every unauthenticated request with a plain-text
  403 "You are not authorized, Forbidden, Contact AIG HD" from an Okta-backed policy proxy.
  Tokens are issued by AIG's customer identity platform at auth1.customerpltfm.aig.com. There is
  no self-service signup — credentials are provisioned to appointed brokers, producers and clients
  through AIG's portals and distribution agreements.
