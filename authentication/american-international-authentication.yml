gateway:
  host: https://commercial.api.aig.com
  anonymous_status: 403
  anonymous_body: 'You are not authorized, Forbidden, Contact AIG HD'
  challenge_headers: none
  finding: >-
    The gateway does NOT emit an RFC 6750 WWW-Authenticate challenge or an RFC 9728
    protected-resource-metadata pointer on its 403, so an agent that reaches the host has no
    machine-readable way to learn where to get a token. The link between the gateway and the Okta
    issuer had to be established by hand.
onboarding:
  self_service: false
  public_signup: false
  channel: >-
    Credentials are provisioned through AIG's broker and producer portals (myAIG, the Producer
    Management Portal) under a distribution or client agreement. There is no public developer
    signup, no API key page, and no sandbox.
gaps:
  - No OpenAPI or public API reference documents which scheme applies to which operation.
  - No RFC 9728 /.well-known/oauth-protected-resource on the gateway host (403 on every path).
  - No security.txt — /.well-known/security.txt is 403 on www.aig.com and on the gateway.
