name: American International Group (AIG)
description: >-
  American International Group (AIG) is one of the world's most extensive international
  insurance organizations, operating in more than 200 countries and jurisdictions.
  AIG provides a broad range of property casualty insurance, life insurance, retirement
  solutions, and other financial services to commercial and individual customers worldwide.
  The company's offerings include casualty, property, cyber, professional liability,
  management liability, marine, aviation, energy, trade credit, and private client insurance.
  AIG runs a live production API gateway at commercial.api.aig.com behind an Okta "Protect Proxy"
  policy, and its customer identity host auth1.customerpltfm.aig.com serves anonymous OpenID Connect
  and OAuth 2.0 authorization-server metadata. AIG publishes no OpenAPI, no public API reference,
  no SDK and no self-service signup — API credentials are provisioned to appointed brokers,
  producers and clients through myAIG and the Producer Management Portal. AIG's own developer
  portal host, developers.aig.com, is still indexed by search engines but refused TCP connections
  when probed on 2026-09-02.
