x-duplicate-of:
  slug: aig
  repo: https://github.com/api-evangelist/aig
  confidence: high
  basis: >-
    Same legal entity. `all/aig` and `all/american-international` both profile American
    International Group, Inc. and both resolve to the same registrable domain, aig.com. The
    2026-09-02 enrichment pass on american-international independently reproduced every host finding
    already recorded under `aig`: commercial.api.aig.com answering HTTP 403 "You are not authorized,
    Forbidden, Contact AIG HD", the same Okta authorization server at
    auth1.customerpltfm.aig.com/oauth2/aus1aaqj1zvwVDL2n5d7, the same 452-byte uniform /.well-known
    403 on www.aig.com, and the same dead developers.aig.com. `aig` is the domain-derived slug and
    carries the richer profile (an apis[] entry for the commercial gateway); this repo carries no
    apis[] entry, deliberately, so the two do not publish competing API records for one company.
  recommended_action: >-
    Merge into `aig` and retire this slug. No competing apis[] entry was created here. Both slugs
    are already published with score history, so the merge is a redirect problem, not a delete.
  evidence:
    - url: https://commercial.api.aig.com/
      status: 403
    - url: https://auth1.customerpltfm.aig.com/.well-known/openid-configuration
      status: 200
    - url: https://developers.aig.com/
      status: '<no response — TCP connection refused>'
  checked: '2026-09-02'
